# This is a Declarative Automation Bundle definition for argos_finance_data_intelligence_platform.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: argos_finance_data_intelligence_platform
  uuid: cab00368-3ce4-4833-b795-2f5a8e231dac

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-92780a62-1d84.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-92780a62-1d84.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/aw.marcel@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/aw.marcel@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: aw.marcel@gmail.com
        level: CAN_MANAGE
